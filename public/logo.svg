<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Primary Brand Orange Gradient for vibrant pop -->
    <linearGradient id="ukOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5722" />
      <stop offset="100%" stop-color="#EA4310" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="logoShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.1" />
    </filter>
  </defs>

  <!-- Clean Base Background -->
  <rect width="512" height="512" rx="36" fill="#FFFFFF" />

  <!-- Outer Orange Tech Border Frame -->
  <rect x="36" y="36" width="440" height="440" rx="16" fill="none" stroke="url(#ukOrange)" stroke-width="32" stroke-linejoin="miter" />

  <!-- Circuit Trace Technical Linework (Light Grey) -->
  <g stroke="#94A3B8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.85">
    <!-- Top-Right Circuit Trace with Terminal Node -->
    <path d="M 320 80 L 410 80 L 410 130" />
    <circle cx="320" cy="80" r="5.5" fill="#64748B" stroke="none" />
    
    <!-- Right Middle Circuit Branch -->
    <path d="M 436 220 L 370 190" />
    <circle cx="370" cy="190" r="6" fill="#64748B" stroke="none" />
    
    <!-- Top Left Circuit Corner & Trace -->
    <path d="M 88 120 L 88 424 L 180 424" />
    
    <!-- Bottom Right Circuit Trace with Terminal Node -->
    <path d="M 416 380 L 416 424 L 320 424" />
    <circle cx="320" cy="424" r="5.5" fill="#64748B" stroke="none" />

    <!-- Left to Center Tech Accent Lines -->
    <path d="M 88 360 L 150 420" />
    <path d="M 360 88 L 424 152" />
    <path d="M 88 152 L 152 88" />
    <path d="M 360 424 L 424 360" />
  </g>

  <!-- Dot Matrix Tech Grids -->
  <g fill="#94A3B8" opacity="0.6">
    <!-- Top Left Dot Grid -->
    <circle cx="106" cy="106" r="3.5" />
    <circle cx="124" cy="106" r="3.5" />
    <circle cx="142" cy="106" r="3.5" />
    <circle cx="160" cy="106" r="3.5" />
    <circle cx="106" cy="124" r="3.5" />
    <circle cx="106" cy="142" r="3.5" />
    <circle cx="106" cy="160" r="3.5" />
    <circle cx="124" cy="124" r="3.5" />

    <!-- Top Center Micro Dots -->
    <circle cx="280" cy="70" r="3" />
    <circle cx="300" cy="70" r="3" />
    <circle cx="320" cy="70" r="3" />

    <!-- Bottom Right Dot Grid -->
    <circle cx="340" cy="424" r="3.5" />
    <circle cx="360" cy="424" r="3.5" />
    <circle cx="380" cy="424" r="3.5" />
    <circle cx="400" cy="424" r="3.5" />
    <circle cx="406" cy="380" r="3.5" />
    <circle cx="406" cy="360" r="3.5" />
    <circle cx="406" cy="340" r="3.5" />
    <circle cx="380" cy="404" r="3.5" />

    <!-- Subtle decorative dot -->
    <circle cx="142" cy="442" r="3" />
    <circle cx="160" cy="442" r="3" />
  </g>

  <!-- Main Center Typography: UK DEV in Bold Geometric Orange -->
  <!-- UK Monogram -->
  <text
    x="256"
    y="262"
    text-anchor="middle"
    font-family="'Outfit', 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    font-weight="900"
    font-size="188"
    letter-spacing="-4"
    fill="url(#ukOrange)"
  >UK</text>

  <!-- DEV Wordmark -->
  <text
    x="256"
    y="398"
    text-anchor="middle"
    font-family="'Outfit', 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    font-weight="900"
    font-size="142"
    letter-spacing="1"
    fill="url(#ukOrange)"
  >DEV</text>
</svg>
