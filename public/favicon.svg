<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6E40" />
      <stop offset="100%" stop-color="#FF5722" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#grad)" />
  
  <!-- Subtle inner border highlight -->
  <rect x="12" y="12" width="488" height="488" rx="116" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="8" />
  
  <!-- Modern Dev Code Accent Dot -->
  <circle cx="410" cy="102" r="22" fill="#FFFFFF" fill-opacity="0.9" />

  <!-- Monogram UK (Umesh Kotwal) -->
  <g filter="url(#shadow)">
    <text x="256" y="336" font-family="-apple-system, BlinkMacSystemFont, 'JetBrains Mono', 'Space Grotesk', system-ui, sans-serif" font-weight="900" font-size="230" fill="#FFFFFF" text-anchor="middle" letter-spacing="-6">UK</text>
  </g>
</svg>
